<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Give Feedback - Healing Garden</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-container": "#caa910",
              "outline": "#717a6d",
              "inverse-surface": "#1b361d",
              "inverse-on-surface": "#d8fad4",
              "on-background": "#06210a",
              "surface-dim": "#c2e3be",
              "primary-container": "#60a560",
              "surface-tint": "#276b2e",
              "on-tertiary-container": "#4c3e00",
              "on-primary-fixed-variant": "#075318",
              "on-primary-fixed": "#002105",
              "on-secondary-container": "#09657f",
              "primary-fixed": "#abf4a7",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#004d62",
              "secondary": "#0c6780",
              "on-tertiary-fixed-variant": "#554500",
              "on-secondary-fixed": "#001f29",
              "on-secondary": "#ffffff",
              "tertiary-fixed": "#ffe174",
              "on-error": "#ffffff",
              "on-surface-variant": "#40493e",
              "surface-variant": "#caebc6",
              "primary-fixed-dim": "#90d88d",
              "outline-variant": "#c0c9bb",
              "on-primary": "#ffffff",
              "primary": "#276b2e",
              "on-surface": "#06210a",
              "on-error-container": "#93000a",
              "tertiary-fixed-dim": "#e7c433",
              "surface-container-highest": "#caebc6",
              "tertiary": "#705d00",
              "surface-container-low": "#dbfdd7",
              "surface": "#ebffe6",
              "surface-container-lowest": "#ffffff",
              "surface-container": "#d6f7d1",
              "secondary-fixed-dim": "#89d0ed",
              "surface-container-high": "#d0f1cc",
              "on-primary-container": "#00370b",
              "error": "#ba1a1a",
              "surface-bright": "#ebffe6",
              "background": "#ebffe6",
              "secondary-fixed": "#baeaff",
              "secondary-container": "#9ae1ff",
              "on-tertiary-fixed": "#221b00",
              "inverse-primary": "#90d88d",
              "error-container": "#ffdad6"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .headline-font {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .mood-bloom {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-emerald-50/80 dark:bg-zinc-950/80 backdrop-blur-2xl docked full-width rounded-b-[2.5rem] shadow-[0_8px_32px_rgba(39,107,46,0.04)]">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-emerald-100/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-emerald-900" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-lg text-emerald-900">Give Feedback</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Title Section -->
<section class="mb-10 text-center relative">
<div class="absolute -top-10 -right-4 w-24 h-24 bg-primary-container/10 mood-bloom blur-xl -z-10"></div>
<h2 class="font-headline font-extrabold text-3xl md:text-4xl text-on-surface tracking-tight mb-3">
                We value your feedback
            </h2>
<p class="font-body text-on-surface-variant text-lg leading-relaxed max-w-md mx-auto">
                Help us nurture this digital sanctuary. Your thoughts help our garden grow stronger.
            </p>
</section>
<!-- Feedback Form Container -->
<div class="space-y-8">
<!-- Category Selection -->
<section>
<label class="font-headline font-bold text-sm uppercase tracking-widest text-primary mb-4 block ml-2">Select Category</label>
<div class="flex flex-wrap gap-3">
<button class="flex items-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-full font-headline font-semibold text-sm shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="featured_play_list">featured_play_list</span>
                        Feature
                    </button>
<button class="flex items-center gap-2 px-6 py-3 bg-surface-container-high text-on-surface-variant rounded-full font-headline font-semibold text-sm hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="pest_control">pest_control</span>
                        Bug
                    </button>
<button class="flex items-center gap-2 px-6 py-3 bg-surface-container-high text-on-surface-variant rounded-full font-headline font-semibold text-sm hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="star">star</span>
                        Content Rating
                    </button>
</div>
</section>
<!-- Input Fields -->
<section class="space-y-6">
<div class="space-y-2">
<label class="font-headline font-bold text-sm uppercase tracking-widest text-primary ml-2" for="subject">Subject</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all font-body text-on-surface placeholder:text-outline-variant" id="subject" placeholder="e.g., New feature request" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-headline font-bold text-sm uppercase tracking-widest text-primary ml-2" for="message">Message</label>
<div class="relative">
<textarea class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all font-body text-on-surface placeholder:text-outline-variant resize-none" id="message" placeholder="Detailed description..." rows="6"></textarea>
</div>
</div>
</section>
<!-- Image/Mood Card (Asymmetric Layout Element) -->
<section class="relative overflow-hidden rounded-xl bg-secondary-container/30 p-8 flex items-center gap-6">
<div class="flex-1">
<h4 class="font-headline font-bold text-on-secondary-container mb-1">Feeling Inspired?</h4>
<p class="text-sm text-on-secondary-container/80">Every small suggestion plants a seed for a more peaceful experience.</p>
</div>
<div class="w-16 h-16 bg-white/40 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="energy_savings_leaf">energy_savings_leaf</span>
</div>
<!-- Asymmetric accent -->
<div class="absolute -bottom-4 -right-4 w-20 h-20 bg-primary-container/20 mood-bloom rotate-45"></div>
</section>
<!-- Action Button -->
<section class="pt-4">
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl font-headline font-bold text-lg flex items-center justify-center gap-3 shadow-[0_12px_32px_rgba(39,107,46,0.2)] hover:opacity-90 active:scale-[0.98] transition-all">
<span>Send Feedback</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center pt-3 pb-8 px-6 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-xl rounded-t-[3rem] shadow-[0_-12px_40px_rgba(6,33,10,0.06)]">
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-emerald-700 px-5 py-2 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="yard">yard</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Garden</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-emerald-700 px-5 py-2 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Journal</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-emerald-700 px-5 py-2 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Insights</span>
</a>
<a class="flex flex-col items-center justify-center bg-emerald-100 dark:bg-emerald-800/40 text-emerald-900 dark:text-emerald-100 rounded-[2rem] px-5 py-2 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Me</span>
</a>
</nav>
<!-- Background Decoration -->
<div class="fixed top-20 left-[-5%] w-64 h-64 bg-primary/5 mood-bloom blur-3xl -z-20 pointer-events-none"></div>
<div class="fixed bottom-40 right-[-10%] w-80 h-80 bg-secondary/5 mood-bloom blur-3xl -z-20 pointer-events-none"></div>
</body></html>
