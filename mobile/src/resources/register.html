<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .organic-blob {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        .bg-garden-gradient {
            background: linear-gradient(135deg, #276b2e 0%, #60a560 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation (Shell Filter: Transactional page - No Navigation, just Branding) -->
<header class="w-full top-0 px-6 pt-8 flex items-center justify-between max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="local_florist">local_florist</span>
<h1 class="font-headline tracking-tighter font-bold text-2xl text-green-900">Healing Garden</h1>
</div>
<button class="text-primary font-semibold hover:opacity-80 transition-opacity">VN</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Background Decorations (Editorial Asymmetry) -->
<div class="absolute -top-24 -right-24 w-64 h-64 organic-blob bg-surface-container-low opacity-50 -z-10"></div>
<div class="absolute top-1/2 -left-32 w-80 h-80 organic-blob bg-secondary-container opacity-20 -z-10"></div>
<div class="w-full max-w-md space-y-10">
<!-- Hero Header Section -->
<div class="space-y-4">
<h2 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface leading-tight">
                    Bắt đầu hành trình <br/>
<span class="text-primary italic">chữa lành.</span>
</h2>
<p class="text-on-surface-variant text-lg max-w-[85%]">
                    Tham gia cùng cộng đồng Healing Garden để tìm lại sự bình yên trong tâm hồn.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<div class="space-y-5">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-headline text-sm font-bold tracking-wide text-on-surface-variant ml-2">
                            Họ tên
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/40" placeholder="Họ và tên của bạn" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" data-icon="person">person</span>
</div>
</div><div class="space-y-2">
<label class="block font-headline text-sm font-bold tracking-wide text-on-surface-variant ml-2">
                            Email
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/40" placeholder="ten-cua-ban@gmail.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-headline text-sm font-bold tracking-wide text-on-surface-variant ml-2">
                            Mật khẩu
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/40" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" data-icon="lock">lock</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block font-headline text-sm font-bold tracking-wide text-on-surface-variant ml-2">
                            Xác nhận mật khẩu
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all placeholder:text-on-surface-variant/40" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50" data-icon="verified_user">verified_user</span>
</div>
</div>
</div>
<!-- Sign Up Button -->
<button class="w-full bg-garden-gradient text-on-primary font-headline font-bold text-lg py-5 rounded-xl shadow-[0_12px_32px_rgba(6,33,10,0.15)] active:scale-[0.98] transition-all flex items-center justify-center gap-3 group" type="submit">
                    Đăng Ký Ngay
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="east">east</span>
</button>
</form>
<!-- Social Sign Up Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-6 bg-background text-on-surface-variant font-medium italic">hoặc tham gia bằng</span>
</div>
</div>
<!-- Social Buttons Grid -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container rounded-xl py-4 hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
<img alt="" class="w-6 h-6 object-contain" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEleeZBCPH7qLrYtVb1zzYOl5c2Ih6751y5cTRbV5M0_TlSGQOCuXAVZRkdfxGx5t-G1SQ8zvYjPfRHChonoDfWqsQuXlwmJyOsdNDyC1nzljIHvKvOIffMk1P4wudg3LhsaeRLWynN8r-MivZ7q0cN11qa3Pzwk581IjwV11Tpmw3OY_Wp_n0yvASnk8ZBqUk8YF7OGW9R8Plb0ntjj5_4KVS3hnzasvv4va7VXya4IQUUPzdUdvB4EyonPakyiRweT6-whB5LFA"/>
<span class="font-headline font-bold text-on-surface text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container rounded-xl py-4 hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-blue-700" data-icon="facebook" data-weight="fill" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span class="font-headline font-bold text-on-surface text-sm">Facebook</span>
</button>
</div>
<!-- Footer Link -->
<div class="text-center pt-4">
<p class="text-on-surface-variant">
                    Bạn đã có tài khoản? 
                    <a class="text-primary font-bold ml-1 hover:underline decoration-2 underline-offset-4" href="#">Đăng nhập ngay</a>
</p>
</div>
</div>
</main>
<!-- Contextual Footer (Shell Filter: Suppression on transactional pages) -->
<footer class="w-full py-8 px-6 text-center text-on-surface-variant/40 text-xs">
<p>© 2024 Healing Garden. Tất cả quyền được bảo lưu.</p>
<div class="mt-2 flex justify-center gap-6">
<a class="hover:text-primary transition-colors" href="#">Điều khoản</a>
<a class="hover:text-primary transition-colors" href="#">Bảo mật</a>
</div>
</footer>
</body></html>
