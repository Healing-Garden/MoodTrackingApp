            -webkit-appearance: none;

            border-radius: 9999px;
        }

            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Top AppBar (Suppressed as per task, using minimal progress branding) -->
<header class="fixed top-0 w-full z-50 bg-emerald-50/80 backdrop-blur-xl px-6 h-20 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" data-icon="spa">spa</span>
</div>
<span class="font-headline font-bold text-xl tracking-tight text-on-background">Healing Garden</span>
</div>
<div class="flex items-center gap-4">
<span class="text-xs font-label font-semibold text-primary/60 tracking-widest uppercase">Step 4 of 4</span>
<div class="w-32 h-2 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
</div>
</header>
<main class="flex-grow pt-32 pb-32 px-6 max-w-4xl mx-auto w-full">
<!-- Header Section -->
<section class="mb-12">
<h1 class="font-headline text-5xl md:text-6xl font-extrabold text-on-background mb-4 tracking-tight">Daily Check-in</h1>
<p class="text-on-surface-variant text-xl md:text-2xl font-light">How are you feeling right now?</p>
</section>
<!-- Bento Layout for Content -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
<!-- Left Column: Mood and Energy -->
<div class="md:col-span-12 space-y-12">
<!-- Mood Selection -->
<div class="space-y-6">
<h2 class="text-sm font-label font-bold tracking-widest uppercase text-primary/70 px-2">Pick your current mood</h2>
<div class="grid grid-cols-5 gap-3">
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-lowest hover:bg-surface-container-high transition-all rounded-xl border border-outline-variant/10 shadow-sm active:scale-95 group">
<span class="text-4xl mb-3 group-hover:scale-110 transition-transform">😫</span>
<span class="font-label text-xs font-medium text-on-surface-variant">Very Low</span>
</button>
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-lowest hover:bg-surface-container-high transition-all rounded-xl border border-outline-variant/10 shadow-sm active:scale-95 group">
<span class="text-4xl mb-3 group-hover:scale-110 transition-transform">😔</span>
<span class="font-label text-xs font-medium text-on-surface-variant">Low</span>
</button>
<button class="flex flex-col items-center justify-center p-4 bg-primary-container text-on-primary-container ring-4 ring-primary/20 rounded-xl shadow-lg group">
<span class="text-4xl mb-3 scale-110">😐</span>
<span class="font-label text-xs font-bold uppercase tracking-tight">Neutral</span>
</button>
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-lowest hover:bg-surface-container-high transition-all rounded-xl border border-outline-variant/10 shadow-sm active:scale-95 group">
<span class="text-4xl mb-3 group-hover:scale-110 transition-transform">😊</span>
<span class="font-label text-xs font-medium text-on-surface-variant">Good</span>
</button>
<button class="flex flex-col items-center justify-center p-4 bg-surface-container-lowest hover:bg-surface-container-high transition-all rounded-xl border border-outline-variant/10 shadow-sm active:scale-95 group">
<span class="text-4xl mb-3 group-hover:scale-110 transition-transform">✨</span>
<span class="font-label text-xs font-medium text-on-surface-variant">Great</span>
</button>
</div>
</div>
<!-- Energy Slider -->
<div class="p-8 bg-surface-container-low rounded-xl relative overflow-hidden">
<div class="relative z-10">
<div class="flex justify-between items-end mb-8">
<div>
<h2 class="text-sm font-label font-bold tracking-widest uppercase text-primary/70 mb-1">Energy Level</h2>
<p class="text-3xl font-headline font-extrabold text-on-background">5/10</p>
</div>
<span class="material-symbols-outlined text-primary text-4xl" data-icon="bolt">bolt</span>
</div>
<input class="w-full mb-4" max="10" min="1" type="range" value="5"/>
<div class="flex justify-between text-xs font-label font-semibold text-on-surface-variant/60 uppercase">
<span>Tired</span>
<span>Energized</span>
</div>
</div>
<!-- Decorative Bloom Background -->
<div class="absolute -right-12 -bottom-12 w-48 h-48 bg-primary/5 mood-bloom-card"></div>

<h2 class="text-sm font-label font-bold tracking-widest uppercase text-primary/70 px-2">What triggered this mood?</h2>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Family</button>
<button class="px-6 py-3 bg-primary text-on-primary rounded-full font-medium shadow-md shadow-primary/20">Work</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Health</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Relationships</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Friends</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Study</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Finance</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Sleep</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Social</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Self-care</button>
<button class="px-6 py-3 bg-surface-container-highest rounded-full text-on-surface-variant font-medium hover:bg-primary hover:text-on-primary transition-all active:scale-90 shadow-sm">Other</button>
</div>
</div>
<!-- Optional Note -->
<div class="space-y-6">
<h2 class="text-sm font-label font-bold tracking-widest uppercase text-primary/70 px-2">Add a quick note <span class="text-on-surface-variant/40 lowercase italic">(optional)</span></h2>
<textarea class="w-full h-40 bg-surface-container-high border-none rounded-xl p-6 font-body text-lg focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant/30 text-on-background" placeholder="Write something briefly..."></textarea>
</div>
</div>
</div>

<div class="max-w-4xl mx-auto flex flex-col items-center">
<button class="w-full md:max-w-md bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-xl py-6 rounded-xl shadow-[0_12px_32px_rgba(39,107,46,0.25)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
                Complete Onboarding
