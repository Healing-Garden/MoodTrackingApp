<!-- Full Screen Wrapper -->
<div class="relative h-screen w-full flex flex-col items-center justify-end overflow-hidden">

<img alt="Healing Garden Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uhYO9EWGyVXHGrCKtWFPMU24NNkVhSYn9f6ryGAKjbEgg4hvCREGom1cQuEJJIbSdjwM8uTBRHfJRQLovR-kN1YVAZqqWQXezvTfhaRAEJAovG5R3LU6JBJ_Dm72afXQnRxBwxpyamUXFYs5OXHQVNJ4fN_p2RM75GVZhCbuil9JojMBoIuKZyyWT_m2R31Fi2OMtlWa_4d4UVqZRmEqvnI0i8_JSzsFyIGopzsWRYp95sEr99wD2_kgjHiTaz0zdTTl4BAQpE1">

</div>
<!-- Main Content Area -->
<main class="relative z-10 w-full h-full flex flex-col justify-between px-8 py-16 md:px-12">
<!-- Top Left Slogan -->
<div class="text-left w-full pt-4">
<p class="font-elegant text-3xl md:text-4xl text-emerald-950 text-shadow-elegant font-medium leading-relaxed max-w-xs"><br><div><br></div></p>
</div>

<div class="w-full max-w-md mx-auto space-y-4 pb-8">

<button class="w-full py-5 rounded-full bg-emerald-900/80 backdrop-blur-md border border-white/20 text-white font-headline font-bold text-lg shadow-xl hover:bg-emerald-900/90 active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
                    Bắt đầu hành trình mới
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Action - White Glass -->
<button class="w-full py-5 rounded-full bg-white/30 backdrop-blur-md border border-white/40 text-emerald-950 font-headline font-semibold text-lg hover:bg-white/40 active:scale-95 transition-all duration-300 shadow-lg">
                    Đã có tài khoản
                </button>
</div>
</main>
</div>
