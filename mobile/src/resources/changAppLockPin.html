      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .pin-dot {
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      body {
        background: radial-gradient(circle at top right, #dbfdd7 0%, #ebffe6 100%);
      }

    body {
      min-height: max(884px, 100dvh);

<body class="font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-[#DBFDD7]/80 dark:bg-green-950/80 backdrop-blur-xl flex items-center px-6 py-4 w-full fixed top-0 z-50">
<button class="hover:bg-[#60A560]/10 dark:hover:bg-green-800/20 transition-colors p-2 rounded-full active:scale-95 duration-200 ease-out">
<span class="material-symbols-outlined text-[#276B2E] dark:text-[#60A560]">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-tight font-bold text-lg text-[#276B2E] dark:text-[#60A560] ml-4">App Lock PIN</h1>
</header>
<main class="flex-1 w-full max-w-md px-8 pt-32 pb-12 flex flex-col items-center justify-between">
<!-- Identity & Header -->
<section class="text-center space-y-4 w-full">
<div class="inline-flex items-center justify-center w-20 h-20 bg-surface-container-high rounded-xl mb-6 shadow-sm border border-outline-variant/10">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface">Change App Lock PIN</h2>
<p class="text-on-surface-variant font-medium max-w-[280px] mx-auto text-sm leading-relaxed">
                Enter your new 4-digit security code to keep your garden private.
            </p>
</section>
<!-- PIN Indicator -->
<section class="my-12 flex space-x-6 justify-center items-center">
<!-- First digit (active/filled) -->
<div class="pin-dot w-5 h-5 rounded-full bg-primary shadow-sm shadow-primary/20"></div>
<!-- Second digit (active/filled) -->
<div class="pin-dot w-5 h-5 rounded-full bg-primary shadow-sm shadow-primary/20"></div>
<!-- Third digit (inactive/empty) -->
<div class="pin-dot w-5 h-5 rounded-full bg-surface-container-highest border-2 border-primary/20"></div>
<!-- Fourth digit (inactive/empty) -->
<div class="pin-dot w-5 h-5 rounded-full bg-surface-container-highest border-2 border-primary/20"></div>
</section>
<!-- Asymmetric Decorative Element -->
<div class="absolute -z-10 top-1/4 -right-12 w-48 h-48 bg-primary-container/20 rounded-full blur-3xl opacity-50"></div>
<div class="absolute -z-10 bottom-1/4 -left-12 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl opacity-40"></div>
<!-- Keypad Grid -->
<section class="w-full grid grid-cols-3 gap-6 mb-8">
<!-- Key 1 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">1</button>
<!-- Key 2 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">2</button>
<!-- Key 3 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">3</button>
<!-- Key 4 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">4</button>
<!-- Key 5 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">5</button>
<!-- Key 6 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">6</button>
<!-- Key 7 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">7</button>
<!-- Key 8 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">8</button>
<!-- Key 9 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">9</button>
<!-- Placeholder/Empty -->
<div></div>
<!-- Key 0 -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-90 text-2xl font-bold font-headline text-primary">0</button>
<!-- Delete -->
<button class="flex flex-col items-center justify-center h-20 rounded-full bg-transparent hover:bg-primary/5 transition-all active:scale-90 text-primary">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</section>
<!-- Secondary Action -->
<button class="font-label text-primary font-bold uppercase tracking-widest text-xs py-3 px-8 rounded-full border border-primary/10 hover:bg-primary/5 transition-colors">
            Forgot PIN?
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-6 pt-3 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-2xl rounded-t-[3rem] shadow-[0_-12px_32px_rgba(6,33,10,0.06)]">
<a class="flex flex-col items-center justify-center text-[#276B2E]/50 dark:text-white/40 p-3 hover:scale-110 transition-transform tap-highlight-none active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">local_florist</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold uppercase tracking-wider">Garden</span>
</a>
<a class="flex flex-col items-center justify-center text-[#276B2E]/50 dark:text-white/40 p-3 hover:scale-110 transition-transform tap-highlight-none active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold uppercase tracking-wider">Journal</span>
</a>
<a class="flex flex-col items-center justify-center text-[#276B2E]/50 dark:text-white/40 p-3 hover:scale-110 transition-transform tap-highlight-none active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold uppercase tracking-wider">Insights</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#60A560] text-white rounded-full p-3 transition-all duration-300 hover:scale-110 tap-highlight-none active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold uppercase tracking-wider">Settings</span>
</a>
</nav>

<div class="fixed bottom-24 -left-12 opacity-20 pointer-events-none transform -rotate-12">
<span class="material-symbols-outlined text-[160px] text-primary">eco</span>
</div>

<span class="material-symbols-outlined text-[120px] text-secondary">psychology_alt</span>
</div>
