<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed": "#abf4a7",
              "tertiary-container": "#caa910",
              "on-tertiary-fixed-variant": "#554500",
              "inverse-surface": "#1b361d",
              "on-primary": "#ffffff",
              "secondary-container": "#9ae1ff",
              "error": "#ba1a1a",
              "primary": "#276b2e",
              "tertiary": "#705d00",
              "on-primary-container": "#00370b",
              "outline-variant": "#c0c9bb",
              "on-primary-fixed": "#002105",
              "on-surface-variant": "#40493e",
              "primary-container": "#60a560",
              "surface-tint": "#276b2e",
              "on-secondary-container": "#09657f",
              "tertiary-fixed": "#ffe174",
              "primary-fixed-dim": "#90d88d",
              "on-primary-fixed-variant": "#075318",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#89d0ed",
              "surface-container-high": "#d0f1cc",
              "error-container": "#ffdad6",
              "outline": "#717a6d",
              "secondary": "#0c6780",
              "on-secondary-fixed-variant": "#004d62",
              "tertiary-fixed-dim": "#e7c433",
              "surface-dim": "#c2e3be",
              "on-surface": "#06210a",
              "on-tertiary": "#ffffff",
              "background": "#ebffe6",
              "on-background": "#06210a",
              "surface-container-lowest": "#ffffff",
              "inverse-primary": "#90d88d",
              "surface-container-low": "#dbfdd7",
              "on-error": "#ffffff",
              "on-tertiary-fixed": "#221b00",
              "on-secondary": "#ffffff",
              "surface-container": "#d6f7d1",
              "surface-container-highest": "#caebc6",
              "on-tertiary-container": "#4c3e00",
              "inverse-on-surface": "#d8fad4",
              "secondary-fixed": "#baeaff",
              "surface-bright": "#ebffe6",
              "surface-variant": "#caebc6",
              "surface": "#ebffe6",
              "on-secondary-fixed": "#001f29"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .organic-blob-1 {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      .organic-blob-2 {
        border-radius: 30% 70% 70% 30% / 50% 60% 40% 50%;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-background selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Intent: Onboarding flow suppressess Global Nav as per "The Destination Rule" -->
<main class="relative min-h-screen flex flex-col items-center justify-between px-8 py-16 overflow-hidden">
<!-- Organic Background Shapes -->
<div class="absolute top-[-10%] left-[-20%] w-[80%] h-[50%] bg-surface-container-high organic-blob-1 opacity-60 blur-3xl -z-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[70%] h-[40%] bg-primary-container/20 organic-blob-2 opacity-50 blur-3xl -z-10"></div>
<!-- Top Branding Hint -->
<header class="w-full flex justify-center items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="spa">spa</span>
<span class="font-headline font-extrabold text-xl tracking-tight text-primary">Healing Garden</span>
</div>
</header>
<!-- Main Content Area: Editorial Layout -->
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-md text-center">
<!-- Illustration Container: Mood Bloom logic -->
<div class="relative mb-12">
<div class="absolute inset-0 bg-primary-container/10 organic-blob-1 scale-125"></div>
<div class="relative w-72 h-72 bg-white/40 backdrop-blur-xl organic-blob-2 flex items-center justify-center shadow-2xl shadow-primary/5">
<div class="relative p-8 rounded-full bg-gradient-to-tr from-primary to-primary-container text-white shadow-xl">
<span class="material-symbols-outlined text-7xl" data-icon="psychology" style="font-variation-settings: 'FILL' 1;">psychology</span>
<!-- Floating Accent -->
<div class="absolute -top-2 -right-2 w-12 h-12 bg-tertiary-container rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-container text-2xl" data-icon="chat">chat</span>
</div>
</div>
</div>
<!-- Visual Decoration: "The Garden Meadow" -->
<div class="absolute -bottom-4 -left-4 text-primary/30 rotate-12">
<span class="material-symbols-outlined text-6xl" data-icon="local_florist">local_florist</span>
</div>
<div class="absolute top-1/2 -right-8 text-secondary/20 -rotate-45">
<span class="material-symbols-outlined text-5xl" data-icon="potted_plant">potted_plant</span>
</div>
</div>
<!-- Typography Hierarchy -->
<h1 class="font-headline text-4xl font-extrabold text-on-surface leading-tight tracking-tight mb-6">
                Bạn không đơn độc
            </h1>
<p class="text-on-surface-variant text-lg leading-relaxed px-4 opacity-90">
                Chatbot của chúng mình luôn lắng nghe và hỗ trợ bạn <span class="font-semibold text-primary">24/7</span> để xoa dịu tâm trí.
            </p>
</div>
<!-- Footer Actions -->
<div class="w-full max-w-sm flex flex-col items-center gap-10">
<!-- Stepper Indicator -->
<div class="flex items-center gap-3">
<div class="w-8 h-2.5 rounded-full bg-primary shadow-sm shadow-primary/20 transition-all duration-300"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary-container transition-all duration-300"></div>
</div>
<!-- Primary Action -->
<button class="group relative w-full overflow-hidden bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold py-5 rounded-xl shadow-[0_12px_32px_rgba(39,107,46,0.15)] active:scale-95 transition-all duration-200">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="relative flex items-center justify-center gap-2 text-lg">
                    Tiếp theo
                    <span class="material-symbols-outlined text-2xl" data-icon="arrow_forward">arrow_forward</span>
</span>
</button>
<!-- Skip Option: Supportive Voice -->
<button class="text-on-surface-variant font-label text-sm font-medium tracking-wide hover:text-primary transition-colors py-2">
                Bỏ qua giới thiệu
            </button>
</div>
</main>
<!-- Visual Polish: Ambient Texture -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] -z-20">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<filter id="noiseFilter">
<feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>
</div>
</body></html>
