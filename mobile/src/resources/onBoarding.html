<button class="p-2 hover:bg-emerald-100/50 transition-colors scale-95 active:duration-150 rounded-full">

</button>
<button class="flex flex-col items-start p-5 text-left bg-surface-container-low hover:bg-surface-container-high text-on-surface rounded-xl transition-all">

<span class="font-headline font-semibold text-lg leading-tight">Build positive habits</span>

<button class="group flex items-center justify-between p-6 bg-surface-container-lowest rounded-lg hover:bg-surface-container-high transition-all shadow-sm">

<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>

<button class="group flex items-center justify-between p-6 bg-surface-container-lowest rounded-lg hover:bg-surface-container-high transition-all shadow-sm">
