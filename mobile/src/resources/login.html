        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;

    body {

<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Suppression: Not rendered for Transactional/Login Screen -->
<main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Asymmetric Decorative Elements -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/20 mood-bloom blur-3xl"></div>
<div class="absolute -bottom-32 -right-16 w-80 h-80 bg-secondary-container/30 mood-bloom blur-3xl"></div>
<div class="w-full max-w-md relative z-10">
<!-- Brand Anchor -->
<div class="flex flex-col items-center mb-12">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center shadow-lg shadow-primary/10 mb-6">
<span class="material-symbols-outlined text-4xl text-on-primary-container" data-icon="spa">spa</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-on-background mb-2">Healing Garden</h1>
<p class="text-on-surface-variant font-medium">Chào mừng bạn trở lại khu vườn tâm hồn</p>
</div>
<!-- Login Form Container -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl p-8 md:p-10 shadow-[0_12px_32px_rgba(6,33,10,0.06)] border border-primary/5">
<form class="space-y-6">
<!-- Input Email -->
<div class="space-y-2">
<label class="block font-headline font-semibold text-sm text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all duration-300 placeholder:text-outline/60 text-on-surface" id="email" placeholder="example@garden.com" type="email"/>
</div>
</div>
<!-- Input Password -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block font-headline font-semibold text-sm text-on-surface-variant" for="password">Mật khẩu</label>
<a class="text-xs font-semibold text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all duration-300 placeholder:text-outline/60 text-on-surface" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                        Đăng nhập
                    </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-xs font-bold text-outline tracking-widest uppercase">Hoặc đăng nhập với</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center py-3 px-4 bg-surface-container rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
<img alt="" class="w-6 h-6 mr-2" data-alt="Google Logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAaxe_2SnuZhqiJDw0XFxPS6YMobh_b6OwyZQacu6CWyYCW4oHgCj_QKZZlRFECRBDlEsdLmrTr26p-YfCWnezVWIOn2VpM38Bu6WwAzirp_xLT3tHQ5SxJ-eM6a6EPbTrfA5fW2zID3EfF-h7q9SR75O8KDdEogrg6ttHwA7F1f5iTJl0x54gUkfBrRb30LkA8pUW3aV-q_F-7JiKuHm8w0R5yyIoiYG-0xyzeMuJMFdqf1y2nqOiduP34Y9tRqlPZGBBUCq7x8M"/>
<span class="font-headline font-bold text-sm text-on-surface-variant">Google</span>
</button>
<button class="flex items-center justify-center py-3 px-4 bg-surface-container rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-blue-600 mr-2" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span class="font-headline font-bold text-sm text-on-surface-variant">Facebook</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant font-medium">
                    Chưa có tài khoản? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-primary-container decoration-2 transition-all" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
</main>
<!-- Bottom Navigation Suppression: Not rendered for Task-Focused Login Screen -->
<footer class="py-8 px-6 text-center text-outline/40 text-xs font-medium tracking-wide">
        © 2024 Healing Garden. Tất cả quyền được bảo lưu.
    </footer>
</body></html>
