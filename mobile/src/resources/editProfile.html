<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Be+Vietnam+Pro:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#075318",
              "inverse-surface": "#1b361d",
              "on-secondary-container": "#09657f",
              "on-secondary-fixed": "#001f29",
              "surface-container-low": "#dbfdd7",
              "inverse-primary": "#90d88d",
              "secondary-fixed-dim": "#89d0ed",
              "on-primary-fixed": "#002105",
              "background": "#ebffe6",
              "on-tertiary-fixed": "#221b00",
              "secondary-container": "#9ae1ff",
              "on-surface-variant": "#40493e",
              "primary-container": "#60a560",
              "surface-variant": "#caebc6",
              "on-background": "#06210a",
              "primary": "#276b2e",
              "tertiary": "#705d00",
              "secondary-fixed": "#baeaff",
              "surface": "#ebffe6",
              "on-tertiary": "#ffffff",
              "on-primary-container": "#00370b",
              "on-primary": "#ffffff",
              "surface-dim": "#c2e3be",
              "error-container": "#ffdad6",
              "tertiary-container": "#caa910",
              "error": "#ba1a1a",
              "surface-tint": "#276b2e",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#d8fad4",
              "surface-bright": "#ebffe6",
              "on-tertiary-fixed-variant": "#554500",
              "on-error": "#ffffff",
              "surface-container-high": "#d0f1cc",
              "secondary": "#0c6780",
              "on-tertiary-container": "#4c3e00",
              "on-secondary": "#ffffff",
              "surface-container-highest": "#caebc6",
              "outline-variant": "#c0c9bb",
              "tertiary-fixed": "#ffe174",
              "on-secondary-fixed-variant": "#004d62",
              "primary-fixed-dim": "#90d88d",
              "outline": "#717a6d",
              "on-surface": "#06210a",
              "surface-container": "#d6f7d1",
              "primary-fixed": "#abf4a7",
              "tertiary-fixed-dim": "#e7c433",
              "on-error-container": "#93000a"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mood-bloom {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        .bg-garden-gradient {
            background: linear-gradient(135deg, #276b2e 0%, #60a560 100%);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="bg-stone-50/80 dark:bg-stone-950/80 backdrop-blur-md text-green-800 dark:text-green-200 docked full-width top-0 sticky z-50 shadow-[0_4px_20px_rgba(39,107,46,0.04)] no-border-tonal-shift-only">
<div class="flex justify-between items-center w-full px-6 py-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-green-50/50 dark:hover:bg-green-900/20 transition-colors active:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-tight text-lg font-semibold text-green-900 dark:text-green-50">Edit Profile</h1>
<button class="font-['Plus_Jakarta_Sans'] tracking-tight text-lg font-semibold text-green-700 dark:text-green-400 hover:bg-green-50/50 dark:hover:bg-green-900/20 px-4 py-1 rounded-full transition-all active:opacity-80 active:scale-95">Save</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow container mx-auto max-w-2xl px-6 pt-10 pb-32">
<!-- Profile Picture Section (Asymmetric & Editorial) -->
<section class="flex flex-col items-center mb-16 relative">
<div class="relative">
<!-- Mood Bloom Background Element -->
<div class="mood-bloom absolute -inset-4 bg-surface-container-low -z-10 rotate-12 opacity-50"></div>
<div class="relative w-40 h-40">
<img alt="User Profile" class="w-full h-full object-cover rounded-xl shadow-lg border-4 border-surface-container-lowest" data-alt="Close up portrait of a smiling woman in soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxK9JJUv2t360QguJF7wk7l4JN_wrUSdRzRXL2TiMMd424laXQ0OhoQ4_TdNxx3Z4WRAgTkP4d5ZO-PSGuJ3azvhPC5UjZLn190iSOllhLxTD8n7dESwFUyH--HR72i8nEAjUePnE5sp-OWBugSGtVCXqFp4QicCDppgeCql_yuDo5QVgmWqe9xkOG4WZVrvcVSGDbg7smMKquuDbeJdn_F_xb71zMPWN_ku3ixgJVzjo8KW56GAOfDT9jETsJ24Tw7Id3v5oKmss"/>
<button class="absolute bottom-2 -right-2 bg-primary-container text-on-primary-container p-3 rounded-full shadow-lg hover:scale-110 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
</div>
<p class="mt-6 text-sm font-label text-outline font-medium tracking-wide">TAP TO UPDATE PHOTO</p>
</section>
<!-- Form Section -->
<div class="space-y-12">
<!-- Bento-style Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name (Spans 2 columns) -->
<div class="md:col-span-2 group">
<label class="block mb-3 px-2 text-xs font-bold uppercase tracking-[0.15em] text-primary/70">Full Name</label>
<div class="flex items-center bg-surface-container-high rounded-full px-6 py-4 transition-all focus-within:bg-surface-bright focus-within:ring-2 focus-within:ring-primary/20">
<span class="material-symbols-outlined text-primary/60 mr-4">person</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-on-surface font-medium placeholder-stone-400" type="text" value="Seraphina Rose"/>
</div>
</div>
<!-- Age -->
<div class="group">
<label class="block mb-3 px-2 text-xs font-bold uppercase tracking-[0.15em] text-primary/70">Age</label>
<div class="flex items-center bg-surface-container-high rounded-full px-6 py-4 transition-all focus-within:bg-surface-bright focus-within:ring-2 focus-within:ring-primary/20">
<span class="material-symbols-outlined text-primary/60 mr-4">calendar_today</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-on-surface font-medium" type="number" value="28"/>
</div>
</div>
<!-- Height -->
<div class="group">
<label class="block mb-3 px-2 text-xs font-bold uppercase tracking-[0.15em] text-primary/70">Height (cm)</label>
<div class="flex items-center bg-surface-container-high rounded-full px-6 py-4 transition-all focus-within:bg-surface-bright focus-within:ring-2 focus-within:ring-primary/20">
<span class="material-symbols-outlined text-primary/60 mr-4">straighten</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-on-surface font-medium" type="number" value="168"/>
</div>
</div>
<!-- Weight -->
<div class="group md:col-span-2">
<label class="block mb-3 px-2 text-xs font-bold uppercase tracking-[0.15em] text-primary/70">Weight (kg)</label>
<div class="flex items-center bg-surface-container-high rounded-full px-6 py-4 transition-all focus-within:bg-surface-bright focus-within:ring-2 focus-within:ring-primary/20">
<span class="material-symbols-outlined text-primary/60 mr-4">monitor_weight</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-on-surface font-medium" type="number" value="62"/>
</div>
</div>
</div>
<!-- Health Goals - Extra Editorial Touch -->
<div class="pt-4">
<h3 class="font-headline text-xl font-bold text-on-surface mb-6 px-2">Garden Intentions</h3>
<div class="flex flex-wrap gap-3">
<span class="bg-emerald-100 text-green-900 px-6 py-2.5 rounded-full text-sm font-medium">Mental Clarity</span>
<span class="bg-emerald-100 text-green-900 px-6 py-2.5 rounded-full text-sm font-medium">Morning Walks</span>
<span class="bg-surface-container-high text-stone-500 px-6 py-2.5 rounded-full text-sm font-medium border border-outline-variant/20 hover:bg-emerald-50 transition-colors cursor-pointer">+ Add Goal</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-white/90 dark:bg-stone-900/90 backdrop-blur-2xl fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 py-3 rounded-t-[3rem] shadow-[0_-12px_32px_rgba(6,33,10,0.06)] no-border tonal-layering">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 p-2 hover:text-green-700 dark:hover:text-green-300 transition-colors group" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-['Be_Vietnam_Pro'] text-[11px] font-medium tracking-wide">Home</span>
</a>
<!-- Garden -->
<a class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 p-2 hover:text-green-700 dark:hover:text-green-300 transition-colors group" href="#">
<span class="material-symbols-outlined">potted_plant</span>
<span class="font-['Be_Vietnam_Pro'] text-[11px] font-medium tracking-wide">Garden</span>
</a>
<!-- Journal -->
<a class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 p-2 hover:text-green-700 dark:hover:text-green-300 transition-colors group" href="#">
<span class="material-symbols-outlined">auto_stories</span>
<span class="font-['Be_Vietnam_Pro'] text-[11px] font-medium tracking-wide">Journal</span>
</a>
<!-- Profile (Active State) -->
<a class="flex flex-col items-center justify-center bg-emerald-100 dark:bg-emerald-900/40 text-green-900 dark:text-green-100 rounded-full px-5 py-1.5 active:scale-110 transition-transform duration-300 ease-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Be_Vietnam_Pro'] text-[11px] font-medium tracking-wide">Profile</span>
</a>
</nav>
</body></html>
